name: Validate CareerPilot
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: node --experimental-strip-types --test tests/backend.test.mjs
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: careerpilot-worker
          path: dist/
          retention-days: 7
